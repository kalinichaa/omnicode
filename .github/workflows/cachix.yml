name: cachix

# Warms https://omnicode.cachix.org for this fork so `nix flake update` is a
# download instead of a from-source build.
#
# This workflow lives on the `cachix` branch, not `dev`. `dev` stays a
# byte-exact fast-forward mirror of upstream, so the patches only travel on
# `cachix`, which is rebased onto upstream/dev on each sync. Users who want
# the cache track `github:kalinichaa/omnicode/cachix`.
#
# It never commits to the branch it builds: it only builds and pushes store
# paths. nix/hashes.json keeps coming from upstream's bot-nix-hashes.yml.
#
# Runs natively on all three systems the flake supports: x86_64-linux on
# ubuntu-24.04, aarch64-linux on ubuntu-24.04-arm, aarch64-darwin on
# macos-latest. Native runners are required, not a preference: bun install's
# --os/--cpu cross-compilation does not produce byte-identical node_modules,
# so a cross-built entry would carry a hash that disagrees with
# nix/hashes.json and every user on that system would rebuild from source.

on:
  push:
    branches: [cachix]
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
  # Needs this file on the default branch, which is `dev` and deliberately
  # does not carry it, so today the push trigger above is the live path.
  # Kept so the workflow stays runnable if it ever moves to `dev`.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CACHE_NAME: omnicode

jobs:
  # A stale nix/hashes.json makes the node_modules fixed-output derivation fail
  # to fetch, so the build cannot even start. That state is normal and
  # transient: upstream's bot opens a pull request within minutes of a
  # lockfile change. Skip instead of failing red, and let the next push after
  # the bot pull request merges warm the cache.
  #
  # The check is deliberately cheap: it compares commit times rather than
  # building, because building node_modules to find out whether we can build
  # node_modules is circular and would double CI cost.
  guard:
    runs-on: ubuntu-24.04
    outputs:
      consistent: ${{ steps.check.outputs.consistent }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check hash/lockfile consistency
        id: check
        run: |
          set -euo pipefail

          inputs_rev=$(git log -1 --format=%H -- \
            bun.lock package.json ':(glob)packages/*/package.json' \
            ':(glob)services/*/package.json' patches nix/node_modules.nix nix/scripts)
          hashes_rev=$(git log -1 --format=%H -- nix/hashes.json)

          echo "newest hash-input commit: ${inputs_rev:-none}"
          echo "nix/hashes.json commit:   ${hashes_rev:-none}"

          # Consistent when no hash input changed after nix/hashes.json was last
          # written, i.e. the hashes commit is the newer of the two.
          if [ -z "$hashes_rev" ]; then
            echo "::warning::nix/hashes.json has no history; skipping"
            consistent=false
          elif [ -z "$inputs_rev" ]; then
            consistent=true
          elif git merge-base --is-ancestor "$inputs_rev" "$hashes_rev"; then
            consistent=true
          else
            consistent=false
            echo "::notice::nix/hashes.json predates the newest hash input; waiting for upstream's hashes bot"
          fi

          echo "consistent=$consistent" >> "$GITHUB_OUTPUT"

      # A stale hash still evaluates (the mismatch only surfaces when the
      # fixed-output derivation is built), so evaluation alone cannot tell the
      # two apart. Run it anyway to catch a broken flake.nix even on skipped
      # runs, which is the one failure the consistency skip would otherwise
      # hide.
      - name: Setup Nix
        uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34

      - name: Evaluate flake
        run: nix eval .#packages.x86_64-linux.opencode.drvPath --raw > /dev/null

  cache-linux:
    needs: guard
    if: needs.guard.outputs.consistent == 'true'
    name: cache-linux (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34

      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build opencode
        run: nix build .#packages.${{ matrix.system }}.opencode --print-build-logs

      # check-nix.yml already treats desktop as optional (upstream TODO #11755),
      # so a desktop failure must not redden a cache run that succeeded for the
      # CLI. Desktop only builds for x86_64-linux.
      - name: Build opencode-desktop
        if: matrix.system == 'x86_64-linux'
        continue-on-error: true
        run: nix build .#packages.x86_64-linux.opencode-desktop --print-build-logs

      - name: Record what was cached
        run: |
          set -euo pipefail
          {
            echo "### Cachix (${{ matrix.system }})"
            echo ""
            echo "- rev: \`${{ github.sha }}\`"
            echo "- cache: \`${{ env.CACHE_NAME }}\`"
            echo "- opencode: \`$(nix path-info .#packages.${{ matrix.system }}.opencode)\`"
          } >> "$GITHUB_STEP_SUMMARY"

  cache-darwin:
    needs: guard
    if: needs.guard.outputs.consistent == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34

      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build opencode
        run: nix build .#packages.aarch64-darwin.opencode --print-build-logs

      - name: Record what was cached
        run: |
          set -euo pipefail
          {
            echo "### Cachix (aarch64-darwin)"
            echo ""
            echo "- rev: \`${{ github.sha }}\`"
            echo "- opencode: \`$(nix path-info .#packages.aarch64-darwin.opencode)\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Moves the `known-good` tag to the newest rev that is both hash-consistent
  # and fully cached on both Linux systems. Needs the whole `cache-linux`
  # matrix, so a failure on either leg blocks the tag and a user pinning
  # `github:kalinichaa/omnicode/known-good` is never handed a rev that would
  # build from source. `.../dev` can briefly point at a rev whose lockfile is
  # ahead of nix/hashes.json; this tag cannot.
  #
  # A tag rather than a commit, so no branch has to be rewritten to record it.
  known-good:
    needs: [guard, cache-linux]
    if: needs.guard.outputs.consistent == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # persist-credentials is on so the tag push below uses checkout's own
      # credential, keeping the token out of the command line and the logs.
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Move known-good tag
        run: |
          set -euo pipefail

          # Only this repository, only the cachix branch: an upstream
          # checkout or a fork syncing this file must not move a tag it does
          # not own.
          if [ "$GITHUB_REPOSITORY" != "kalinichaa/omnicode" ]; then
            echo "::notice::not the fork; leaving known-good alone"
            exit 0
          fi
          if [ "$GITHUB_REF" != "refs/heads/cachix" ]; then
            echo "::notice::not the cachix branch; leaving known-good alone"
            exit 0
          fi

          git tag -f known-good "$GITHUB_SHA"
          git push --force origin refs/tags/known-good
